<!doctype html>
<html lang="zh-CN">
<head>
  ⁠<meta name="referrer" content="no-referrer">⁠
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffbfe" />
  <meta name="description" content="我的博客" />
  <title>我的博客</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="home">
  <div class="background-layer" aria-hidden="true"></div>

  <header class="top-app-bar" data-nav>
    <div class="top-app-bar__inner wrap">
      <a href="index.html" class="brand" aria-label="返回首页">
        <img class="brand__logo" src="assets/icon.png" alt="" />
        <span class="brand__text">
          <strong data-site-name>我的博客</strong>
          <small data-site-tagline>TOUR TAGLINE</small>
        </span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a class="nav-destination is-active" href="index.html">首页</a>
        <a class="nav-destination" href="about.html">关于</a>
        <button class="icon-button" data-theme-toggle aria-label="切换主题" title="切换主题"><span data-theme-icon aria-hidden="true"></span></button>
      </nav>
    </div>
  </header>

  <main>
    <section class="announcement-banner wrap" data-banner hidden aria-label="公告">
      <span class="announcement-banner__icon" aria-hidden="true"><span class="symbol symbol--campaign"></span></span>
      <div class="announcement-banner__body">
        <span class="announcement-banner__label" data-banner-label>公告</span>
        <strong class="announcement-banner__title" data-banner-title></strong>
        <p class="announcement-banner__text" data-banner-text></p>
        <a class="announcement-banner__link" data-banner-link target="_blank" rel="noopener noreferrer" hidden></a>
      </div>
      <button class="icon-button announcement-banner__dismiss" type="button" data-banner-dismiss aria-label="关闭公告" title="关闭公告"><span class="symbol symbol--close" aria-hidden="true"></span></button>
    </section>

    <section class="hero wrap" aria-labelledby="hero-title">
      <div class="hero__content" data-reveal>
        <p class="eyebrow" data-home-eyebrow>个人博客</p>
        <h1 class="display-large" id="hero-title" data-home-title>记录所见，<br />分享所见。</h1>
        <p class="body-large hero__intro" data-home-intro></p>
        <div class="chip-row" data-home-chips aria-label="关注方向"></div>
        <div class="hero__actions">
          <a class="button button--filled" href="#articles">查看文章</a>
          <a class="button button--tonal" href="about.html">关于我</a>
        </div>
      </div>

      <div class="hero__visual" data-reveal>
        <span class="expressive-shape expressive-shape--main" aria-hidden="true"></span>
        <span class="expressive-shape expressive-shape--accent" aria-hidden="true"></span>
        <div class="hero-carousel" data-hero-carousel>
          <div class="hero-carousel__track" data-hero-track aria-roledescription="carousel">
            <div class="hero-carousel__slides" data-hero-slides></div>
          </div>
          <button class="icon-button hero-carousel__nav hero-carousel__nav--prev" type="button" data-hero-prev aria-label="上一张"><span class="symbol symbol--chevron-left" aria-hidden="true"></span></button>
          <button class="icon-button hero-carousel__nav hero-carousel__nav--next" type="button" data-hero-next aria-label="下一张"><span class="symbol symbol--chevron-right" aria-hidden="true"></span></button>
          <div class="hero-carousel__indicators" data-hero-indicators role="tablist" aria-label="头图指示器"></div>
        </div>
      </div>
    </section>

    <section class="articles-section wrap" id="articles">
      <div class="section-heading">
        <div>
          <p class="eyebrow">文章</p>
          <h2 class="headline-large">最近更新</h2>
        </div>
        <span class="count-badge" data-post-count aria-label="文章数量">—</span>
      </div>

      <div class="article-tools">
        <div class="search-panel" data-search-wrap>
          <div class="search-panel__head">
            <div>
              <span class="search-panel__title">搜索文章</span>
              <span class="search-panel__hint">从标题、摘要和标签中查找</span>
            </div>
            <span class="search-shortcut" aria-label="按斜杠键快速搜索"><span>快捷键</span><kbd>/</kbd></span>
          </div>
          <div class="search-bar">
            <span class="search-bar__leading" aria-hidden="true"><span class="symbol symbol--search"></span></span>
            <input id="post-search" type="search" placeholder="输入关键词…" autocomplete="off" aria-label="搜索文章" />
            <button class="icon-button search-clear" type="button" data-search-clear hidden aria-label="清除搜索" title="清除搜索"><span class="symbol symbol--close" aria-hidden="true"></span></button>
          </div>
        </div>
        <div class="filter-chips" data-category-tabs role="tablist" aria-label="文章分类"></div>
      </div>

      <div class="post-grid" id="post-container" aria-live="polite">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
      <div class="empty-state" data-empty hidden>
        <strong>没有匹配的文章</strong>
        <p>试试其他关键词或分类。</p>
      </div>
    </section>
  </main>

  <button class="fab" data-back-to-top hidden aria-label="返回顶部" title="返回顶部"><span class="symbol symbol--arrow-up" aria-hidden="true"></span></button>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <span class="body-small" data-copyright></span>
      <div class="footer-links" data-social-links></div>
    </div>
  </footer>

  <script type="module" src="assets/main.js"></script>
</body>
</html>
